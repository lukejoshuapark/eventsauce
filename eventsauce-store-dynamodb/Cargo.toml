[package]
name = "eventsauce-store-dynamodb"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "A DynamoDB-backed Store implementation for eventsauce."
readme = "README.md"
license = "MIT"
repository = "https://github.com/lukejoshuapark/eventsauce"
keywords = ["event-sourcing", "dynamodb", "aws", "store"]
categories = ["database-implementations", "asynchronous"]

[lib]
path = "lib.rs"

[dependencies]
eventsauce = { version = "0.3.0", path = "../eventsauce" }

aws-sdk-dynamodb = "1"
serde_json = "1"
serde = "1"
time = "0.3"
uuid = "1"

[dev-dependencies]
eventsauce-macros = { version = "0.1.0", path = "../eventsauce-macros", features = ["serde"] }

aws-config = { version = "1", features = ["behavior-version-latest"] }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4"] }
