[package]
name = "eventsauce-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Procedural macros for eventsauce."
readme = "README.md"
license = "MIT"
repository = "https://github.com/lukejoshuapark/eventsauce"
keywords = ["event-sourcing", "macro", "derive", "codegen"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
path = "lib.rs"
proc-macro = true

[features]
serde = []

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
eventsauce = { path = "../eventsauce" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde-well-known"] }
uuid = { version = "1", features = ["serde", "v4"] }
