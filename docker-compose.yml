services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    ports:
      - 8993:8000
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8000/shell"]
      interval: 1s
      timeout: 5s
      retries: 10
  table_creator:
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID: "ABC123"
      AWS_SECRET_ACCESS_KEY: "321CBA"
    depends_on:
      dynamodb:
        condition: service_healthy
    command: dynamodb create-table --region us-east-1 --table-name test --attribute-definitions AttributeName=StreamId,AttributeType=S AttributeName=Name,AttributeType=S --key-schema AttributeName=StreamId,KeyType=HASH AttributeName=Name,KeyType=RANGE --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb:8000
  ready:
    image: busybox
    depends_on:
      table_creator:
        condition: service_completed_successfully
